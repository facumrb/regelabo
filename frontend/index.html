<!DOCTYPE html>
<html lang="es" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio Virtual Auditivo — Modelo Verhulst 2018</title>
    <meta name="description" content="Simulador biofísico auditivo periférico humano con cálculo de EFR, armónicos y ondas ABR en tiempo real." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Tema antes de pintar (decisión 024): el elegido por el usuario, o el del sistema
      (function () {
        var guardado = null;
        try { guardado = localStorage.getItem("tema"); } catch (e) {}
        var oscuro = guardado ? guardado === "oscuro" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
