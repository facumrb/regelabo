[project]
name = "regelabo"
version = "0.1.0"
description = "Laboratorio Virtual Auditivo: simulación del modelo Verhulst et al. (2018)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "numpy",
    "scipy",
    "matplotlib",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "python-dotenv>=1.2.4",
    "argon2-cffi>=25.1.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "flake8",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
